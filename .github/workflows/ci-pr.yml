name: ci-pr

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Test
        run: node --test checks/*.test.ts

  build:
    name: 构建
    uses: ./.github/workflows/build.yml

  upload:
    name: 上传运行信息
    runs-on: ubuntu-latest
    if: github.repository == 'zotero-chinese/website' && github.event_name == 'pull_request'
    steps:
      - name: 保存 PR 编号
        run: |
          echo "${{ github.event.number }}" > pr_num
      - name: 上传 PR 编号
        uses: actions/upload-artifact@v7
        with:
          name: pr-num
          path: ./pr_num
