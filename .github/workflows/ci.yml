name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-triggered-by-wiki-repo
      - update-triggered-by-plugins-repo
      - update-triggered-by-styles-repo
      - update-triggered-by-translators-repo
      - update-triggered-by-blog-repo
      - update-content
  schedule:
    # https://github.com/syt2/zotero-addons-scraper/blob/master/.github/workflows/main.yml
    # '25 4,7,10,14,19,23 * * *'
    - cron: '50 4,7,10,14,19,23 * * *' # +8(beijing)

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy-github:
    name: Deploy to GitHub Pages
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && github.repository == 'zotero-chinese/website'
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: zotero-chinese/zotero-chinese.github.io
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: build-result
          path: dist

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          repository-name: zotero-chinese/zotero-chinese.github.io
          branch: gh-pages
          folder: dist
          single-commit: true
          token: ${{ secrets.ACCESS_TOKEN }}
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com

  deploy-server:
    name: Deploy to Server via SSH
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && github.repository == 'zotero-chinese/website'
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: build-result
          path: dist

      - name: Deploy to Server via SSH
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: dist/
          TARGET: ${{ secrets.SERVER_PATH }}
          # 构建产物带内容 hash 且每次构建都会变，rsync 默认不删除远端多余文件，
          # 旧 hash 文件只增不减，长期累积会把服务器磁盘占满
          # （即 rsync 报 write failed: No space left on device）。
          # --delete-after 在传输成功后清理远端多余文件，让远端与 dist/ 一致。
          # 必须排除宝塔的 .user.ini 与 ACME 的 .well-known：这两者不在 dist/ 中，
          # 会被当成多余文件删除，而前者通常是不可写的保护文件，删不掉会让 rsync 失败。
          ARGS: '-rlgoDzvc -i --delete-after'
          EXCLUDE: '.user.ini,.well-known'
          # 部署前先清空远端目录。--delete 也要依赖 rsync 成功建好文件列表，
          # 磁盘已满时连临时列表和临时文件都写不进去，仅靠 --delete 解不开这个死局，
          # 所以必须先腾出空间。
          # 只删实际内容，保留目录本身与以 . 开头的隐藏项（.user.ini、.well-known 等）。
          SCRIPT_BEFORE: |
            set -e
            TARGET="${{ secrets.SERVER_PATH }}"
            if [ -z "$TARGET" ] || [ "$TARGET" = "/" ] || [ "$TARGET" = "." ] || [ "$TARGET" = "$HOME" ]; then
              echo "❌ Refusing to clean unsafe TARGET: '$TARGET'"
              exit 1
            fi
            cd "$TARGET"
            echo "Disk usage of $TARGET before cleanup:"
            du -sh "$TARGET" 2>/dev/null || true
            df -h "$TARGET" || true
            find . -mindepth 1 -maxdepth 1 ! -name '.??*' -exec rm -rf {} +
            echo "Disk usage after cleanup:"
            du -sh "$TARGET" 2>/dev/null || true
            df -h "$TARGET" || true
          SCRIPT_AFTER: |
            echo "Deployment completed at $(date)"
            df -h "${{ secrets.SERVER_PATH }}" || true

  seo-push:
    name: 推送 URL 至搜索引擎
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && github.repository == 'zotero-chinese/website'
    # 依赖 build 而非某个部署 job，避免部署步骤失败时连带跳过推送
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main

      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: build-result
          path: src/.vitepress/dist

      # 百度普通收录与必应 IndexNow 主动推送：把新页面的发现时间从数周缩短到分钟级。
      # 未配置 token 时脚本会跳过，不影响构建。
      - name: Push URLs
        run: node .github/scripts/seo-push.ts
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
