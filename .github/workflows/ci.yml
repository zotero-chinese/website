name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-triggered-by-wiki-repo
      - update-triggered-by-plugins-repo
      - update-triggered-by-styles-repo
      - update-triggered-by-translators-repo
      - update-triggered-by-blog-repo
      - update-content
  schedule:
    # https://github.com/syt2/zotero-addons-scraper/blob/master/.github/workflows/main.yml
    # '25 4,7,10,14,19,23 * * *'
    - cron: '50 4,7,10,14,19,23 * * *' # +8(beijing)

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy-github:
    name: Deploy to GitHub Pages
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && github.repository == 'zotero-chinese/website'
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: zotero-chinese/zotero-chinese.github.io
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: build-result
          path: dist

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          repository-name: zotero-chinese/zotero-chinese.github.io
          branch: gh-pages
          folder: dist
          single-commit: true
          token: ${{ secrets.ACCESS_TOKEN }}
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com

  deploy-server:
    name: Deploy to Server via SSH
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && github.repository == 'zotero-chinese/website'
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: build-result
          path: dist

      - name: Deploy to Server via SSH
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: dist/
          TARGET: ${{ secrets.SERVER_PATH }}
          # --delete-after 在传输成功后清理远端多余文件，让远端与 dist/ 一致。
          ARGS: '-rlgoDzvc -i --delete-after'
          EXCLUDE: '.user.ini,.well-known'
          SCRIPT_AFTER: |
            echo "Deployment completed at $(date)"
            df -h "${{ secrets.SERVER_PATH }}" || true

  seo-push:
    name: 推送 URL 至搜索引擎
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && github.repository == 'zotero-chinese/website'
    # 依赖 build 而非某个部署 job，避免部署步骤失败时连带跳过推送
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main

      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: build-result
          path: src/.vitepress/dist

      # 增量推送需要记住「哪些 URL 已推过、推的是哪个版本的 lastmod」。
      # 状态文件丢失只会退化为全量推送（安全但浪费配额），不会推错页面。
      # restore-keys 让滚动缓存能接上前一天的记录。
      - name: Restore SEO State
        uses: actions/cache/restore@v5
        with:
          path: .seo-push-state.json
          key: seo-push-state-${{ github.run_id }}
          restore-keys: |
            seo-push-state-

      # 百度普通收录与必应 IndexNow 主动推送：把新页面的发现时间从数周缩短到分钟级。
      # 未配置 token 时脚本会跳过，不影响构建。
      - name: Push URLs
        run: node .github/scripts/seo-push.ts
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SEO_STATE_PATH: .seo-push-state.json
          # 百度普通收录的每日配额（本站实测 10 条/天）。
          # 不设时脚本依据响应中的 remain 自行收手，首批只探测 10 条。
          BAIDU_DAILY_QUOTA: ${{ vars.BAIDU_DAILY_QUOTA }}

      # 只保存成功推送后的状态：脚本失败时不会把未成功的 URL 记成已推送
      - name: Save SEO State
        if: success()
        uses: actions/cache/save@v5
        with:
          path: .seo-push-state.json
          key: seo-push-state-${{ github.run_id }}
