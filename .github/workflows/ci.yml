name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-triggered-by-wiki-repo
      - update-triggered-by-plugins-repo
      - update-triggered-by-styles-repo
      - update-triggered-by-translators-repo
      - update-triggered-by-blog-repo
      - update-content
  schedule:
    # https://github.com/syt2/zotero-addons-scraper/blob/master/.github/workflows/main.yml
    # '25 4,7,10,14,19,23 * * *'
    - cron: '50 4,7,10,14,19,23 * * *' # +8(beijing)

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy-github:
    name: Deploy to GitHub Pages
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && github.repository == 'zotero-chinese/website'
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: zotero-chinese/zotero-chinese.github.io
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: build-result
          path: dist

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          repository-name: zotero-chinese/zotero-chinese.github.io
          branch: gh-pages
          folder: dist
          single-commit: true
          token: ${{ secrets.ACCESS_TOKEN }}
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com

  deploy-server:
    name: Deploy to Server via SSH
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && github.repository == 'zotero-chinese/website'
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: build-result
          path: dist

      - name: Deploy to Server via SSH
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: dist/
          TARGET: ${{ secrets.SERVER_PATH }}
          SCRIPT_AFTER: |
            echo "Deployment completed at $(date)"

  seo-push:
    name: 推送 URL 至搜索引擎
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && github.repository == 'zotero-chinese/website'
    # 依赖 build 而非某个部署 job，避免部署步骤失败时连带跳过推送
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Build Output
        uses: actions/download-artifact@v8
        with:
          name: build-result
          path: src/.vitepress/dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 百度普通收录与必应 IndexNow 主动推送：把新页面的发现时间从数周缩短到分钟级。
      # 未配置 token 时脚本会跳过，不影响构建。
      - name: Push URLs
        run: node .github/scripts/seo-push.ts
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
